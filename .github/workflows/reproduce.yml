name: reproduce

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-artifact:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Reproduce confirmation and performance evidence
        run: bash scripts/reproduce_all.sh "${RUNNER_TEMP}/p01-reproduction"
      - name: Upload exact reproduction evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: p01-reproduction-${{ github.sha }}
          path: ${{ runner.temp }}/p01-reproduction
          if-no-files-found: error
          retention-days: 90
