name: reproduce

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-artifact:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Reproduce confirmation and performance evidence
        run: bash scripts/reproduce_all.sh "${RUNNER_TEMP}/p01-reproduction"
      - name: Upload exact reproduction evidence
        uses: actions/upload-artifact@v4
        with:
          name: p01-reproduction-${{ github.sha }}
          path: ${{ runner.temp }}/p01-reproduction
          if-no-files-found: error
          retention-days: 90
